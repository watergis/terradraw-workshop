# Japanese translation catalog.
#
# Page bodies are NOT translated here — they live next to their English source
# as `docs/**/XXX.ja.md`. This file only holds the strings that come from
# configuration or from the theme: the site metadata, the navigation titles
# declared in `zensical.toml`, and the UI labels used by `overrides/`.
#
# `scripts/build_i18n.py` reads this file, applies it to `zensical.toml` and
# writes the generated per-language config to `build/i18n/ja/zensical.toml`.

site_name = "Terra Draw チュートリアル"
site_description = "あらゆる地図アプリケーションで使える描画ライブラリ Terra Draw のチュートリアルドキュメントです。"

