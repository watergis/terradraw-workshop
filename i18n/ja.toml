# ----------------------------------------------------------------------------
# UI labels
#
# Zensical ships its own Japanese catalog for the built-in chrome
# (`templates/partials/languages/ja.html`), so only the strings this repository
# adds itself need translating here. They are exposed to the templates as
# `config.extra.ui.*`. The live editor widget carries its own string table
# keyed on `<html lang>` (see `docs/assets/live-editor/live-editor.js`).
# ----------------------------------------------------------------------------
[ui]
slides = "プレゼンモードに切り替え"

# Light/dark toggle labels, matched against `theme.palette[].toggle.name`.
[palette]
"Switch to dark mode" = "ダークモードに切り替え"
"Switch to light mode" = "ライトモードに切り替え"
